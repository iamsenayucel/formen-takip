name: docker-build

# CD (bilinçli olarak sınırlı kapsam — bkz. README "CI/CD"):
#   - `build`: her PR/push'ta backend+frontend imajlarının gerçekten build
#     olduğunu doğrular, hiçbir yere push etmez. Fork PR'larında da güvenle
#     çalışır (registry credential gerektirmez).
#   - `publish`: yalnızca `push` event'inde çalışır (pull_request tetiklemez,
#     dolayısıyla fork PR'ları asla publish edemez) ve imajları GHCR'ye
#     yalnızca GitHub'ın kendi GITHUB_TOKEN'ıyla, yalnızca bu job'a tanınan
#     packages: write ile publish eder — ayrı bir secret/PAT gerekmez.
#   - Gerçek bir sunucuya (SSH/K8s/vb.) otomatik deploy YOKTUR: bu bilgiler
#     (host, credential, hedef ortam) bu görev kapsamında verilmedi. Elle/
#     onaylı bir dağıtım için bkz. deploy.yml (workflow_dispatch iskeleti).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.service }} image (push yok, yalnızca doğrulama)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish:
    name: publish (${{ matrix.service }} -> GHCR)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
