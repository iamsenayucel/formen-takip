name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    # 2026-09-16 itibarıyla tüm git geçmişine (10 commit) karşı lokal olarak
    # doğrulandı: 0 bulgu. Baseline temiz olduğu için bu job blocking'dir.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR'lara otomatik yorum atmak pull-requests: write gerektirir; minimum
          # yetki ilkesi gereği bu job yalnızca contents: read taşır, yorum kapalı.
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-audit:
    name: pip-audit (backend, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit==2.10.1
      - name: Run pip-audit (blocking)
        working-directory: backend
        # BLOCKING (2026-09-18): requirements.txt yükseltildi (starlette, cryptography,
        # python-jose, pyasn1 [transitive], python-multipart) — 2026-09-16 baseline'ındaki
        # 5 pakette 20 tekil advisory'nin 19'u kapatıldı. Kalan tek bulgu, `ecdsa`
        # PYSEC-2026-1325 (GHSA-wj6h-64fc-37mp / CVE-2024-23342, Minerva timing side-channel),
        # `--ignore-vuln` ile açıkça listelenmiştir — bkz. tier2/06-security.md "Bağımlılık
        # Güvenliği İstisnası" için tam gerekçe/kanıt/gözden geçirme koşulu. Bu tek satırlık
        # allowlist dışında hiçbir bulgu bastırılmaz; `set -euo pipefail` audit'in exit
        # code'unun `tee` tarafından maskelenmesini engeller.
        run: |
          set -euo pipefail
          python -m pip_audit -r requirements.txt --desc \
            --ignore-vuln PYSEC-2026-1325 \
            | tee pip-audit-output.log
          {
            echo "### pip-audit sonucu (blocking)"
            echo '```'
            cat pip-audit-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
