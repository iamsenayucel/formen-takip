name: codeql

# Repo public olduğu için CodeQL/code scanning GitHub tarafından ücretsiz
# sağlanır (GHAS lisansı gerekmez) — bkz. github/codeql-action README
# "Workflow Permissions" bölümü. Bulgular Security > Code scanning alerts
# sekmesinde görünür; bu workflow'un kendisi PR'ı bloklamaz (informational/
# SAST sinyali) — bloklayıcı yapmak isteniyorsa branch protection'da ayrıca
# required check olarak seçilmelidir (bkz. README).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:python"
